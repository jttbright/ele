<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#4a0010">
    <title>JTT Bright Electric | Premium Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --glass-bg: rgba(0, 0, 0, 0.35);
            --glass-border: rgba(255, 215, 0, 0.3);
            --text: #fff5e6;
            --text-dim: #fde68a;
            --shadow-gold: 0 8px 32px rgba(245, 158, 11, 0.25);
        }

        body {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3b 30%, #c9a03d 70%, #d4af37 100%);
            color: #1a1a2e;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.5);
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .cta-btn i { transition: transform 0.35s ease; }
        .cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.7), 0 8px 25px rgba(245, 158, 11, 0.5);
        }
        .cta-btn:hover i { transform: translateX(5px); }
        .cta-btn:active { transform: scale(0.98); }

        .hero { text-align: center; padding: 1rem 0; }
        .hero-icon { font-size: 3rem; filter: drop-shadow(0 0 10px #fbbf24); }
        .hero-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff5e6, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-subtitle { color: #fde68a; margin-bottom: 1rem; }

        /* সেকেন্ডারি নেভ */
            color: #1a1a2e;
            transform: translateY(-2px);
        }
        .edit-nav-btn {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .edit-nav-btn:hover {
            background: #f59e0b;
            color: #1a1a2e;
        }

        /* বটম ট্যাব - ১ম নেভিগেশন */
            color: #1a1a2e;
            color: #1a1a2e;
            color: #1a1a2e;
    <!-- সেকেন্ডারি নেভিগেশন বার -->
<!-- ১ম নেভিগেশন (বটম ট্যাব) -->
<div class="bottom-tab">
    <button class="tab-btn active" data-page="home"><i class="fas fa-home"></i><span>হোম</span></button>
    <button class="tab-btn" data-page="notice"><i class="fas fa-bullhorn"></i><span>নোটিশ</span></button>
    <button class="tab-btn" data-page="job"><i class="fas fa-briefcase"></i><span>জব</span></button>
    <button class="tab-btn" data-page="product"><i class="fas fa-plug"></i><span>প্রোডাক্ট</span></button>
    <button class="tab-btn" data-page="contact"><i class="fas fa-headset"></i><span>কন্টাক্ট</span></button>
</div>

<button class="floating-admin" id="floatingAdminBtn"><i class="fas fa-user-shield"></i></button>

<script>
    // ========== কনফিগারেশন ==========
    // 🔴 আপনার Google Apps Script Web App URL বসান 🔴
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdO_Nhn6vbJeQSGt-PuvmfQoHjo3PsL5Drk6z0oHCxJ41ldVULFfNF6Dc0qulVNjnm/exec';
    
    let isAdmin = false;
    let notices = [], jobs = [], products = [], contacts = {}, navLinks = [];

    // ========== ৫টি ডিফল্ট লিংক ==========
    const DEFAULT_NAV_LINKS = [
        { id: '1', text: '💰 Financial', url: 'https://script.google.com/macros/s/AKfycbw1p4qBTHrOsXFtXTLsnd0dnT1Sn5ZE0FSqUSxN8mdCAG-_31F-NDcUghExHBz5zztaxw/exec' },
        { id: '2', text: '📊 Dealer To Retailer Sale', url: 'https://script.google.com/macros/s/AKfycbw1p4qBTHrOsXFtXTLsnd0dnT1Sn5ZE0FSqUSxN8mdCAG-_31F-NDcUghExHBz5zztaxw/exec' },
        { id: '3', text: '📋 Attendance', url: 'https://script.google.com/macros/s/AKfycbxRWwE3oGt-JqNTmXzPLZyxpVEubtglHbRKXu63blB_hlDBWS4tEmo-sACXrdD95qUJIA/exec' },
        { id: '4', text: '👥 Employees', url: 'https://script.google.com/macros/s/AKfycbyDXG2pmjSNZREbmRNtVVb5_VUjXaE0aWRuwc3GICJe7SGEvQqFSYnE5L4w6vSBTkuX/exec' },
        { id: '5', text: '📦 Package', url: 'https://script.google.com/macros/s/AKfycbzrQ9YF4WminK1FHbxJO-foWdpY5RcITcxyFG7OPMTPVeqVfyT_r0O8haMAyFbsORQT/exec' }
    ];

    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    async function callAPI(action, data = {}) {
        try {
            const body = new URLSearchParams({ action, ...data });
            const response = await fetch(API_URL, { method: 'POST', body });
            const result = await response.json();
            return result;
        } catch (error) {
            console.error('API Error:', error);
            return { success: false, error: error.message };
        }
    }

    async function loadAll() {
        try {
            // লোকাল স্টোরেজ থেকে নেভ লিংক লোড করার চেষ্টা
            const savedNav = localStorage.getItem('jtt_nav_links');
            if (savedNav) {
                navLinks = JSON.parse(savedNav);
            } else {
                navLinks = [...DEFAULT_NAV_LINKS];
                localStorage.setItem('jtt_nav_links', JSON.stringify(navLinks));
            }
            
            // API থেকে ডাটা লোড
            const [n, j, p, c] = await Promise.all([
                callAPI('getNotices'), callAPI('getJobs'), callAPI('getProducts'),
                callAPI('getContacts')
            ]);
            
            if (n.success) notices = n.data || [];
            if (j.success) jobs = j.data || [];
            if (p.success) products = p.data || [];
            if (c.success) contacts = c.data || {};
            
            renderAll();
        } catch(e) {
            console.error('Load Error:', e);
            navLinks = [...DEFAULT_NAV_LINKS];
            renderAll();
        }
    }

    function renderAll() {
        renderNotices();
        renderJobs();
        renderProducts();
        renderContacts();
        renderSecondaryNav();
        
        const adminBtns = document.querySelectorAll('.admin-btn');
        adminBtns.forEach(btn => btn.style.display = isAdmin ? 'inline-flex' : 'none');
    }

    function renderNotices() {
        let c = document.getElementById('noticesList');
        if(!c) return;
        if(!notices || notices.length === 0) {
            c.innerHTML = '<div style="text-align:center;color:#fde68a;">কোনো নোটিশ নেই</div>';
            return;
        }
        c.innerHTML = notices.map(n => `
            <div class="notice-item">
                <div style="color:#fbbf24;font-weight:bold;">📢 ${escapeHtml(n.title)}</div>
                <small style="color:#fde68a;">${n.date || ''}</small>
                <p style="color:#fff5e6;">${escapeHtml(n.description)}</p>
                ${isAdmin ? `<div class="admin-icons">
                    <button class="icon-btn edit" onclick="openEditNotice('${n.id}')"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn del" onclick="deleteItem('notice','${n.id}')"><i class="fas fa-trash"></i></button>
                </div>` : ''}
            </div>
        `).join('');
    }

    function renderJobs() {
        let c = document.getElementById('jobsList');
        if(!c) return;
        if(!jobs || jobs.length === 0) {
            c.innerHTML = '<div style="text-align:center;color:#fde68a;">কোনো জব নেই</div>';
            return;
        }
        c.innerHTML = jobs.map(j => `
            <div class="job-item">
                <h4 style="color:#fbbf24;">💼 ${escapeHtml(j.title)}</h4>
                <div style="color:#fde68a;">${escapeHtml(j.company)} | ${j.location}</div>
                <div style="color:#fde68a;">📅 শেষ: ${j.deadline}</div>
                <p style="color:#fff5e6;">${escapeHtml(j.details)}</p>
                ${isAdmin ? `<div class="admin-icons">
                    <button class="icon-btn edit" onclick="openEditJob('${j.id}')"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn del" onclick="deleteItem('job','${j.id}')"><i class="fas fa-trash"></i></button>
                </div>` : ''}
            </div>
        `).join('');
    }

    function renderProducts() {
        let c = document.getElementById('productsList');
        if(!c) return;
        if(!products || products.length === 0) {
            c.innerHTML = '<div style="text-align:center;color:#fde68a;">কোনো প্রোডাক্ট নেই</div>';
            return;
        }
        c.innerHTML = products.map(p => `
            <div class="product-item">
                <img class="product-img" src="${p.imageUrl || 'https://placehold.co/400x300/f59e0b/1a1a2e?text=Product'}" onerror="this.src='https://placehold.co/400x300/f59e0b/1a1a2e?text=Product'">
                <h4 style="color:#fbbf24;">${escapeHtml(p.name)}</h4>
                <div style="color:#fbbf24;">${p.price}</div>
                <p style="color:#fff5e6;">${escapeHtml(p.description)}</p>
                ${isAdmin ? `<div class="admin-icons">
                    <button class="icon-btn edit" onclick="openEditProduct('${p.id}')"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn del" onclick="deleteItem('product','${p.id}')"><i class="fas fa-trash"></i></button>
                </div>` : ''}
            </div>
        `).join('');
    }

    function renderContacts() {
        let c = document.getElementById('contactDisplay');
        if(!c) return;
        c.innerHTML = `
            <div class="contact-row"><span><i class="fas fa-envelope"></i> ইমেইল</span><a href="mailto:${contacts.email || ''}" style="color:#fbbf24;">${contacts.email || 'info@jttbright.com'}</a></div>
            <div class="contact-row"><span><i class="fas fa-phone"></i> ফোন</span><span style="color:#fde68a;">${contacts.phone || '+880-1234-567890'}</span></div>
            <div class="contact-row"><span><i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপ</span><a href="${contacts.whatsapp || 'https://wa.me/8801712345678'}" target="_blank" style="color:#fbbf24;">লিংক</a></div>
            <div class="contact-row"><span><i class="fab fa-facebook"></i> ফেসবুক</span><a href="${contacts.facebook || 'https://facebook.com/jttbright'}" target="_blank" style="color:#fbbf24;">ভিজিট করুন</a></div>
        `;
    }

    function renderSecondaryNav() {
        let c = document.getElementById('secondaryNav');
        if(!c) return;
        if(!navLinks || navLinks.length === 0) {
            c.innerHTML = '<span style="color:#fde68a;">কোনো লিংক নেই</span>';
            return;
        }
        
        const getIcon = (text) => {
            if (text.includes('Financial') || text.includes('💰')) return '<i class="fas fa-chart-line"></i>';
            if (text.includes('Dealer') || text.includes('📊')) return '<i class="fas fa-exchange-alt"></i>';
            if (text.includes('Attendance') || text.includes('📋')) return '<i class="fas fa-calendar-check"></i>';
            if (text.includes('Employees') || text.includes('👥')) return '<i class="fas fa-users"></i>';
            if (text.includes('Package') || text.includes('📦')) return '<i class="fas fa-box"></i>';
            return '<i class="fas fa-link"></i>';
        };
        
        c.innerHTML = navLinks.map(l => {
            let displayText = l.text.replace(/[💰📊📋👥📦]/g, '').trim();
            return `<a href="${l.url}" target="_blank" class="nav-link-custom">${getIcon(l.text)} ${escapeHtml(displayText)}</a>`;
        }).join('');
    }

    function escapeHtml(s) { 
        if(!s) return ''; 
        return String(s).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); 
    }

    // ========== নেভ লিংক এডিট ==========
    async function editNavLinks() {
        if(!isAdmin) {
            showToast('অ্যাডমিন লগইন করুন');
            return;
        }
        let currentStr = navLinks.map(l => `${l.text}|${l.url}`).join('\n');
        showModal('🔗 নেভিগেশন লিংক এডিট করুন', '🔗', [
            { name: 'links', label: 'লিংক (প্রতি লাইনে একটি: টেক্সট|URL)', 
              placeholder: '💰 Financial|https://...\n📊 Dealer To Retailer Sale|https://...\n📋 Attendance|https://...\n👥 Employees|https://...\n📦 Package|https://...', 
              type: 'textarea', value: currentStr }
        ], async (vals) => {
            if(vals.links) {
                let lines = vals.links.split('\n').map(s => s.trim()).filter(s => s);
                let newArr = [];
                for(let line of lines) {
                    let [txt, url] = line.split('|');
                    if(txt && url) {
                        newArr.push({ id: Date.now() + Math.random().toString(), text: txt.trim(), url: url.trim() });
                    }
                }
                if(newArr.length) {
                    navLinks = newArr;
                    localStorage.setItem('jtt_nav_links', JSON.stringify(navLinks));
                    renderSecondaryNav();
                    showToast('✅ নেভ লিংক আপডেট হয়েছে');
                } else {
                    showToast('❌ ভুল ফরম্যাট! টেক্সট|URL আকারে দিন');
                }
            }
        });
    }

    // ========== পপআপ মডাল ==========
        if(!isAdmin) { showToast('অ্যাডমিন লগইন করুন'); return; }
        showModal('➕ নতুন নোটিশ', '📢', [
            { name: 'title', label: 'শিরোনাম', placeholder: 'নোটিশের শিরোনাম', type: 'text' },
            { name: 'date', label: 'তারিখ', placeholder: '২৫ মে ২০২৬', type: 'text' },
            { name: 'description', label: 'বর্ণনা', placeholder: 'বিস্তারিত লিখুন...', type: 'textarea' }
        ], async (vals) => {
            if(vals.title) {
                await callAPI('addNotice', vals);
                showToast('✅ নোটিশ যোগ হয়েছে');
                loadAll();
            }
        });
    }
    
    function openEditNotice(id) {
        let item = notices.find(n => n.id == id);
        if(item) {
            showModal('✏️ নোটিশ এডিট করুন', '📝', [
                { name: 'title', label: 'শিরোনাম', type: 'text', value: item.title },
                { name: 'date', label: 'তারিখ', type: 'text', value: item.date },
                { name: 'description', label: 'বর্ণনা', type: 'textarea', value: item.description }
            ], async (vals) => {
                await callAPI('updateNotice', { id, ...vals });
                showToast('✅ নোটিশ আপডেট হয়েছে');
                loadAll();
            });
        }
    }
    
    // Job CRUD
    function openAddJob() {
        if(!isAdmin) { showToast('অ্যাডমিন লগইন করুন'); return; }
        if(!isAdmin) { showToast('অ্যাডমিন লগইন করুন'); return; }
        if(!isAdmin) { showToast('অ্যাডমিন লগইন করুন'); return; }
        showModal('📞 কন্টাক্ট তথ্য আপডেট', '📱', [
            { name: 'email', label: 'ইমেইল', type: 'text', value: contacts.email || '' },
            { name: 'phone', label: 'ফোন নম্বর', type: 'text', value: contacts.phone || '' },
            { name: 'whatsapp', label: 'হোয়াটসঅ্যাপ লিংক', type: 'text', value: contacts.whatsapp || '' },
            { name: 'facebook', label: 'ফেসবুক লিংক', type: 'text', value: contacts.facebook || '' }
        ], async (vals) => {
            await callAPI('updateContacts', vals);
            showToast('✅ কন্টাক্ট আপডেট হয়েছে');
            loadAll();
        });
    }

    // অ্যাডমিন লগইন
    async function login(u, p) {
        let r = await callAPI('verifyAdmin', { username: u, password: p });
        if(r.success) {
            isAdmin = true;
            localStorage.setItem('jtt_admin', 'true');
            showToast('🔓 অ্যাডমিন লগইন সফল');
            renderAll();
            return true;
        }
        return false;
    }

    function loginModal() {
        showModal('🔐 অ্যাডমিন লগইন', '👑', [
            { name: 'username', label: 'ইউজারনেম', placeholder: 'admin', type: 'text' },
            { name: 'password', label: 'পাসওয়ার্ড', placeholder: '••••••', type: 'password' }
        ], async (vals) => {
            let ok = await login(vals.username, vals.password);
            if(!ok) alert('❌ ভুল তথ্য! ব্যবহার করুন: admin / admin123');
        });
    }
    
    function logout() {
        isAdmin = false;
        localStorage.removeItem('jtt_admin');
        renderAll();
        showToast('🔒 লগ আউট হয়েছে');
    }

    // ========== ইভেন্ট লিসেনার ==========
    // ১ম নেভিগেশন (ট্যাব ক্লিক)
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            let page = btn.getAttribute('data-page');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page + 'Page').classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        });
    });
    
    // বাটন ইভেন্ট
    const addNoticeBtn = document.getElementById('addNoticeBtn');
    const addJobBtn = document.getElementById('addJobBtn');
    const addProductBtn = document.getElementById('addProductBtn');
    const editContactBtn = document.getElementById('editContactBtn');
    const editNavBtn = document.getElementById('editNavBtn');
    const floatingAdmin = document.getElementById('floatingAdminBtn');
    const mainCta = document.getElementById('mainCtaBtn');
    
    if(addNoticeBtn) addNoticeBtn.addEventListener('click', openAddNotice);
    if(addJobBtn) addJobBtn.addEventListener('click', openAddJob);
    if(addProductBtn) addProductBtn.addEventListener('click', openAddProduct);
    if(editContactBtn) editContactBtn.addEventListener('click', editContacts);
    if(editNavBtn) editNavBtn.addEventListener('click', editNavLinks);
    if(floatingAdmin) floatingAdmin.onclick = () => isAdmin ? logout() : loginModal();
    if(mainCta) mainCta.addEventListener('click', () => {
        const productTab = document.querySelector('.tab-btn[data-page="product"]');
        if(productTab) productTab.click();
        showToast('🔌 আমাদের প্রোডাক্ট দেখুন');
    });
    
    // চেক করুন আগে থেকে অ্যাডমিন লগইন ছিল কিনা
    if(localStorage.getItem('jtt_admin') === 'true') isAdmin = true;
    
    // ডাটা লোড করুন
    loadAll();
    
    // গ্লোবাল ফাংশন এক্সপোজ
    window.deleteItem = deleteItem;
    window.openEditNotice = openEditNotice;
    window.openEditJob = openEditJob;
    window.openEditProduct = openEditProduct;
</script>
</body>
</html>
